[build-system]
requires = [
  "setuptools>=42",
  "setuptools-scm>=8.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "pysdic"
requires-python = ">= 3.11"
dynamic = ["version"]
description = "Python Stereo-Digital Image Correlation (Computer Vision Cameras Models, Image Processing, Meshes and tools for SDIC analysis)"
license = {file = "LICENSE"}
authors = [
{name = "Artezaru", email = "artezaru.github@proton.me"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "matplotlib>=3.7.0",
    "opencv-python-headless>=4.9",
    "pysolve-gn>=2.2.0",
]

[project.optional-dependencies]
# One extra per feature (see pysdic/_optionals.py), then "all".
frames = ["py3dframe>=2.0.1"]
zernike = ["pyzernike-polynomials>=4.0.0"]
meshio = ["meshio"]
vtk = ["vtk>=9.0"]
pyvista = ["pyvista"]
open3d = ["open3d"]
hdf5 = ["h5py"]
all = [
    "py3dframe>=2.0.1",
    "pyzernike-polynomials>=4.0.0",
    "meshio",
    "vtk>=9.0",
    "pyvista",
    "open3d",
    "h5py",
]

[project.urls]
Homepage = "https://github.com/Artezaru/pysdic"
Documentation = "https://Artezaru.github.io/pysdic"
Source = "https://github.com/Artezaru/pysdic"
Tracker = "https://github.com/Artezaru/pysdic/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pysdic", "pysdic*"]
exclude = ["laboratory", "laboratory.*", "tests", "tests*", "examples", "examples*"]

[tool.setuptools.package-data]
"pysdic.resources" = ["*"]

[tool.setuptools.dynamic]
version = {attr = "pysdic.__version__.__version__"}

[project.readme]
file = "README.md"
content-type = "text/markdown"